name: Build ZN-M2 OpenWrt Firmware

on:
  workflow_dispatch:
  # Auto-build on push so a committed fix is always compiled.
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_TAG: main
  CONFIG_FILE: zn-m2.config
  DIY_SH1: diy-part1.sh
  DIY_SH2: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ZN-M2 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build info
        run: |
          echo "============================================"
          echo " ZN-M2 ImmortalWrt Firmware Build (MINIMAL DAE EDITION)"
          echo "============================================"
          echo " Source: VIKINGYFY/ImmortalWrt ${{ env.REPO_TAG }} (NSS Full Support)"
          echo " Kernel: 6.18 + eBPF/BTF (required by dae)"
          echo " WiFi:   DISABLED (no WiFi needed)"
          echo " Features: dae + daed (official web UI, no tailscale)"
          echo " Date:   $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "============================================"

      - name: Free disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost /usr/lib/jvm /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          echo "=== After cleanup ==="
          df -h /

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y \
            build-essential clang llvm flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            wget curl time coreutils quilt perl python3-pip
          sudo -E apt-get clean
          df -h /

      - name: Create swap file
        run: |
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Clone source code
        run: |
          echo "Cloning VIKINGYFY/ImmortalWrt $REPO_TAG (NSS full support)..."
          git clone --depth 1 --single-branch -b "$REPO_TAG" \
            "$REPO_URL" openwrt

          cd openwrt
          echo "=== Git info ==="
          git log -1 --format="%H %ci %s"
          echo ""
          echo "=== Kernel version ==="
          grep -r "KERNEL_PATCHVER" target/linux/qualcommax/Makefile 2>/dev/null || true
          echo ""
          echo "=== Verify ipq60xx subtarget exists ==="
          grep "ipq60xx" target/linux/qualcommax/Makefile 2>/dev/null || {
            echo "ERROR: ipq60xx subtarget NOT found!"
            exit 1
          }
          echo "ipq60xx subtarget confirmed."
          echo ""
          echo "=== Existing IPQ60xx devices (before patching) ==="
          grep "TARGET_DEVICES += " target/linux/qualcommax/image/ipq60xx.mk 2>/dev/null || true

      - name: Cache toolchain and dl
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir/host
          # Prefix must change when the source tree changes (v25.12.1 -> VIKINGYFY/main,
          # kernel 6.12 -> 6.18), otherwise a stale staging_dir would be restored
          # on top of a different source tree and break the build.
          # NOTE: config content changed (minimal dae edition) -> new cache key.
          key: ${{ runner.os }}-zn-m2-viky-main-dae-${{ hashFiles('configs/zn-m2.config') }}
          restore-keys: |
            ${{ runner.os }}-zn-m2-viky-main-dae-
            ${{ runner.os }}-zn-m2-viky-main-

      - name: Run DIY script (part 1 - before feeds)
        run: |
          cd openwrt
          chmod +x ../scripts/$DIY_SH1
          ../scripts/$DIY_SH1

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run DIY script (part 2 - after feeds)
        run: |
          cd openwrt
          chmod +x ../scripts/$DIY_SH2
          ../scripts/$DIY_SH2

      - name: Apply custom config
        run: |
          cd openwrt
          # files/ overlay is populated by diy-part2.sh (CN mirrors,
          # LAN 192.168.2.1, open WiFi via uci-defaults).
          # NOTE: do NOT copy the upstream repo's files/ (contains the
          # original author's PPPoE credentials) - we only use our own.
          mkdir -p files
          echo "=== Overlay files (from diy-part2.sh) ==="
          find files -type f 2>/dev/null || echo "(empty)"
          cp ../configs/$CONFIG_FILE .config
          make defconfig

          echo "=== Key config items ==="
          grep -E "TARGET_qualcommax|TARGET.*DEVICE.*zn_m2|LINUX|dae|daed|DEBUG_INFO_BTF|BPF" .config || true

          echo "=== dae packages (v4: dae + luci-app-daede, no daed backend) ==="
          if grep -q "^CONFIG_PACKAGE_dae=y" .config && grep -q "^CONFIG_PACKAGE_luci-app-daede=y" .config; then
            echo "  [OK] dae + luci-app-daede selected"
          else
            echo "  ::error::dae/luci-app-daede packages NOT selected - check config and feeds!"
            exit 1
          fi

          echo "=== eBPF/BTF kernel options (required by dae) ==="
          for opt in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_KERNEL_CGROUP_BPF CONFIG_KERNEL_BPF_EVENTS CONFIG_BPF_TOOLCHAIN_HOST CONFIG_KERNEL_XDP_SOCKETS; do
            if grep -q "^${opt}=y" .config; then
              echo "  [OK] $opt=y"
            else
              echo "  ::error::$opt is not set - dae will NOT work! Fix configs/zn-m2.config."
              exit 1
            fi
          done


          echo "=== Chinese (Simplified) language support ==="
          if grep -q "^CONFIG_LUCI_LANG_zh_Hans=y" .config; then
            echo "  [OK] CONFIG_LUCI_LANG_zh_Hans=y (gate for luci-i18n-*-zh-cn)"
          else
            echo "  ::error::CONFIG_LUCI_LANG_zh_Hans is not set - every"
            echo "  luci-i18n-*-zh-cn package is dropped by defconfig and the UI"
            echo "  stays English. Fix configs/zn-m2.config."
            exit 1
          fi
          grep -E "^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y" .config || \
            echo "  WARNING: no Chinese translation packages selected!"

          echo "=== NSS packages available in source tree ==="
          ls package/qca-nss/ 2>/dev/null || echo "  WARNING: package/qca-nss not found!"
          echo "=== Device DTS in source tree ==="
          ls target/linux/qualcommax/dts/ipq6000-m2.dts 2>/dev/null || echo "  WARNING: ipq6000-m2.dts not found!"

          echo "=== Verify target device ==="
          if grep -q "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y" .config; then
            echo "OK: ZN-M2 device selected correctly!"
          else
            echo "ERROR: ZN-M2 device NOT selected! Check config and patches."
            echo "Current target devices:"
            grep "CONFIG_TARGET.*DEVICE.*=y" .config || true
            exit 1
          fi

          echo "=== Package count ==="
          grep "=y" .config | wc -l

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) 2>&1 | tail -20 || {
            echo "Download failed, retrying..."
            make download -j1 V=s 2>&1 | tail -50
          }

      - name: Compile firmware
        run: |
          cd openwrt
          echo "Starting compilation at $(date)"
          # NOTE: `make ... | tail` would make the pipeline exit with tail's
          # status, so a failed make would be reported as success. Use
          # PIPESTATUS to get make's real exit code.
          set +e
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -100
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "============================================"
            echo "First pass failed (rc=$rc), retrying single thread..."
            echo "============================================"
            make -j1 V=s 2>&1 | tail -200
            rc=${PIPESTATUS[0]}
          fi
          set -e
          echo "Compilation finished at $(date) with rc=$rc"
          exit $rc

      - name: List output files
        run: |
          cd openwrt
          echo "=== Output files ==="
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \) 2>/dev/null || true
          echo ""
          echo "=== File sizes ==="
          ls -lh bin/targets/*/*/ 2>/dev/null || true

      - name: Verify firmware images exist
        run: |
          cd openwrt
          if ls bin/targets/*/*/*-squashfs-sysupgrade.bin bin/targets/*/*/*-squashfs-factory.ubi >/dev/null 2>&1; then
            echo "OK: sysupgrade + factory images produced."
          else
            echo "::error::No squashfs sysupgrade/factory images found - build produced no firmware!"
            find bin/targets/ -maxdepth 3 2>/dev/null || true
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          cd openwrt
          mkdir -p /tmp/firmware-output
          find bin/targets/ \( -name "*sysupgrade*" -o -name "*factory*" -o -name "*.ubi" \) 2>/dev/null | \
            while read f; do cp "$f" /tmp/firmware-output/; done
          cp .config /tmp/firmware-output/zn-m2-build-config 2>/dev/null || true
          cd /tmp/firmware-output
          sha256sum * > sha256sums.txt 2>/dev/null || true
          echo "=== Final artifacts ==="
          ls -lh /tmp/firmware-output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2-firmware-${{ github.run_id }}
          path: /tmp/firmware-output/*
          retention-days: 30

      - name: Create release
        # Must also run for push-triggered builds: with
        # `github.event_name == 'workflow_dispatch'` the push builds produced
        # images and artifacts but never a release, so no firmware appeared
        # on the Releases page even though the build was successful.
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ZN-M2-${{ github.run_id }}
          name: ZN-M2 Firmware ${{ github.run_id }} (minimal dae edition)
          body: |
            ## ZN-M2 ImmortalWrt Firmware - Minimal DAE Edition

            **Build Date:** ${{ github.run_id }}
            **Source:** VIKINGYFY/ImmortalWrt main (NSS Full Support)
            **Kernel:** 6.18 + eBPF/BTF (required by dae)
            **WiFi:** Disabled (not needed)

            ### Included Features
            - **dae** - transparent proxy (eBPF-based)
            - **daed** - official dae web UI (replaces luci-app-dae)
            - **ttyd** - web terminal
            - **NSS hardware acceleration** (nss-drv + ecm + nss-dp + ssdk + firmware)
            - **All 4 ports shown as separate devices** (lan1/lan2/lan3/wan)
            - Nothing else - minimal build for 128MB NAND

            ### Notes
            - Presets: LAN 192.168.2.1, WiFi open (no password), CN opkg mirrors.
              WAN uses DHCP by default; set PPPoE in LuCI if needed.
            - When dae's transparent proxy is active, disable hardware flow
              offloading to avoid conflicts:
              `/etc/init.d/qca-nss-ecm stop && /etc/init.d/qca-nss-ecm disable`
            - Do NOT run passwall/openclash alongside dae.

            ### Installation
            1. Flash `*-factory.ubi` via U-Boot (first install)
            2. Flash `*-sysupgrade.bin` via LuCI (upgrade)
            3. Default IP: 192.168.1.1
            4. No default password (set on first login)
          files: /tmp/firmware-output/*
          draft: false
          prerelease: false
